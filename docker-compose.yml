# ═══════════════════════════════════════════════════════════════════════════════
# FYK Consolidated — Local Development Stack
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fyk
      POSTGRES_USER: fyk
      POSTGRES_PASSWORD: fyk_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fyk -d fyk']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://fyk:fyk_dev@db:5432/fyk
      AUTH_SECRET: dev-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
