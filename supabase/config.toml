[project]
id = "fyk-consolidated"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = "http://localhost:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
bind = "0.0.0.0"
port = 54324
ip_version = "IPv4"

# ---------------------------------------------------------------------------
# Edge functions — every one declares its JWT posture, because the platform default is
# silent and both directions of getting it wrong are load-bearing here.
#
#   * `ai-chat` / `moderate` are called by a signed-in browser with its own access token:
#     `verify_jwt = true` is what makes the platform reject a forged one before any model
#     spend or moderation request happens, and `ai-chat` needs it as the identity its
#     per-user limit keys off.
#   * `notify` is invoked by Postgres through `pg_net` (0023 §4, 0025) and `cron-cleanup`
#     by an external scheduler. Neither can present a user JWT, so both must be
#     `verify_jwt = false` — and *both use the service role*, which is why each additionally
#     requires a shared secret header (`x-fyk-push-token` / `x-fyk-cron-token`, compared in
#     constant time, refusing when unset). `src/lib/migration-invariants.test.ts` enforces
#     exactly that pairing: no service-role write path behind an unauthenticated URL.
#   * There used to be a fifth, `embed-profile`: a public endpoint that read profiles with
#     the service role, i.e. unusable with the JWT check and RLS-bypassing without it, with
#     no caller in the app. It is deleted rather than configured (AUDIT §2.22).
# ---------------------------------------------------------------------------
# Every function declares its posture explicitly. Inheriting the platform default
# means a new function silently becomes public (or silently stops working for the
# scheduler that calls it), and neither failure is visible in a diff — which is what
# `src/lib/migration-invariants.test.ts` ("declares a JWT posture for every
# function") is for.
#
# The rule the declarations below follow:
#   * called by a signed-in browser  -> verify_jwt = true
#   * called by Postgres/scheduler   -> verify_jwt = false AND a shared-secret
#     header (`x-fyk-*-token`) compared in constant time, refusing 503 when the
#     secret is unset. No service-role write path sits behind an unauthenticated URL.
#
# `cleanup-expired` and `streak-check` are cron-shaped but hold privilege without a
# shared secret, so they are declared `true`: the honest posture until they grow the
# token guard `cron-cleanup` already has. Reach them through `cron-cleanup`, which
# pg_cron/pg_net already schedule (0023 §5).

[functions.ai-chat]
verify_jwt = true

[functions.ai-intent-detect]
verify_jwt = true

[functions.auto-moderate]
verify_jwt = true

[functions.check-infractions]
verify_jwt = true

[functions.cleanup-expired]
verify_jwt = true

[functions.cron-cleanup]
verify_jwt = false

[functions.divine-complete]
verify_jwt = false

[functions.generate-embeddings]
verify_jwt = true

[functions.match-profiles]
verify_jwt = true

[functions.meetnow-boost]
verify_jwt = true

[functions.mfa-setup]
verify_jwt = true

[functions.mfa-verify]
verify_jwt = true

[functions.moderate]
verify_jwt = true

[functions.notify]
verify_jwt = false

[functions.rate-limit]
verify_jwt = true

[functions.search-nearby]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

[functions.streak-check]
verify_jwt = true

[extensions]
pgvector = { enabled = true, schema = "extensions" }
pgcrypto = { enabled = true, schema = "extensions" }
uuid-ossp = { enabled = true, schema = "extensions" }
pg_trgm = { enabled = true, schema = "extensions" }
pg_stat_statements = { enabled = true, schema = "extensions" }
