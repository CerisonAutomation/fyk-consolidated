# ═══════════════════════════════════════════════════════════════════════════════
# FYK Consolidated — CI Pipeline
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check / Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # `lint:changed` diffs against the base branch, which needs history.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Three gates, in the order they answer different questions.
      #
      # `lint:changed` is the blocking one: the repository carries UI debt (see AUDIT
      # §3.17 — 322 errors in ~60 screen files, mostly `useExhaustiveDependencies` and
      # a11y), and a gate that fails on every PR is a gate nobody reads. Diff-based
      # linting keeps the *new* line enforced without pretending the debt is gone.
      #
      # `lint:code` is the scope this codebase owns outright — `src/lib`, the API
      # routes, the Supabase integrations, the auth domain, the schema — and it is
      # zero-error here, so it can block.
      #
      # `lint` stays informational: it prints the repo-wide count on every run, which
      # is what stops the debt from quietly growing, without making an unrelated PR red.
      # Blocking: only the files this branch touches, and only beyond what
      # `lint-baseline.json` already grandfatheres. A PR cannot add a violation, and the
      # ledger itself is reviewed because `--strict-baseline` below keeps demanding it
      # shrink.
      - name: Lint (changed files)
        run: pnpm lint:changed

      - name: Lint (owned scope)
        run: pnpm lint:code

      - name: Lint (repo-wide, informational)
        run: pnpm lint
        continue-on-error: true

      # On main, a stale ledger is an error: whoever fixed a violation shrinks the file in
      # the same PR, so the debt is monotonic. PRs only get the note.
      - name: Lint (baseline may only shrink)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/lint-gate.mjs --strict-baseline

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fyk:${{ github.sha }} .

      - name: Verify health check endpoint exists in image
        run: |
          docker create --name fyk-verify fyk:${{ github.sha }}
          docker inspect --format='{{.Config.Healthcheck}}' fyk-verify
          docker rm fyk-verify
